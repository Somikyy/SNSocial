#
#   Плагин бесплатный и с открытым исходным кодом. Если он тебе пригодился —
#   загляни в Telegram: там выходят новые плагины линейки SN, а ещё там можно
#   заказать плагин или 3D-модель под свой проект.
#
#                              ▸  t.me/somikyy  ◂
#
# ─────────────────────────────────────────────────────────────────────────────
#  КАК ЗАПУСТИТЬ ЗА 15 МИНУТ
# ─────────────────────────────────────────────────────────────────────────────
#  Telegram:
#   1. Создай бота у @BotFather (/newbot), скопируй токен в telegram.bot-token.
#   2. Добавь бота АДМИНИСТРАТОРОМ своего канала (права можно урезать до нуля).
#      Без админства Telegram не даёт проверять подписчиков — это их правило.
#   3. Впиши канал в telegram.channel: @имя_канала или числовой -100…-ID.
#
#  VK:
#   1. В сообществе: Управление → Работа с API → Ключи доступа → создай ключ
#      с правами «управление сообществом» и «сообщения сообщества».
#   2. Там же на вкладке Long Poll API: включи Long Poll и версию API 5.199,
#      на вкладке «Типы событий» отметь «Входящее сообщение».
#   3. Разреши сообщения сообщества (Управление → Сообщения → Включены).
#   4. Впиши ключ в vk.group-token, числовой ID группы — в vk.group-id.
#
#  Дальше: /snsocial link telegram или /snsocial link vk в игре.
# ─────────────────────────────────────────────────────────────────────────────

# Не трогать. Используется для миграции конфигов между версиями.
config-version: 1

general:

  # Язык сообщений: ru или en. Тексты можно править точечно: создай рядом
  # файл messages-ru.txt и напиши в него только те строки, что хочешь заменить.
  language: ru

  # Проверять при старте, не вышла ли новая версия SNSocial.
  # Это один HTTPS-запрос к api.github.com в отдельном потоке. Любая ошибка
  # гасится молча. false — плагин не делает этот запрос вообще.
  update-check: true


# ─────────────────────────────────────────────────────────────────────────────
#  TELEGRAM
# ─────────────────────────────────────────────────────────────────────────────
telegram:

  enabled: true

  # Токен бота от @BotFather. Никому его не показывай: токен = полный доступ
  # к боту. Плагин отправляет его только на api.telegram.org.
  bot-token: ""

  # Канал, подписку на который проверяем. Публичный: "@my_channel".
  # Приватный: числовой ID вида -1001234567890 (бот @userinfobot подскажет).
  # Бот обязан быть администратором этого канала.
  channel: ""


# ─────────────────────────────────────────────────────────────────────────────
#  ВКОНТАКТЕ
# ─────────────────────────────────────────────────────────────────────────────
vk:

  enabled: true

  # Ключ доступа сообщества с правами «управление» (нужно для Long Poll API)
  # и «сообщения» (чтобы бот мог отвечать на код привязки).
  group-token: ""

  # Числовой ID группы, БЕЗ минуса. Узнать: regvk.com/id или vk.com/dev.
  group-id: 0

  # Базовый адрес API. Если хостинг за пределами РФ и api.vk.com не отвечает,
  # попробуй https://api.vk.ru — оба официальные.
  api-url: "https://api.vk.com"


# ─────────────────────────────────────────────────────────────────────────────
#  ПЕРЕПРОВЕРКА ПОДПИСОК (антиабуз)
# ─────────────────────────────────────────────────────────────────────────────
check:

  # Раз в сколько минут перепроверять подписки у всех привязанных игроков.
  # Отписался — награда с revoke-commands откатывается. Проверка идёт в
  # отдельном потоке, по одному игроку в ~150 мс, лимиты API не задеваются.
  interval-minutes: 60

  # Перепроверять игрока при входе на сервер.
  on-join: true

  # Задержка перед проверкой при входе, в секундах, чтобы не лезть в сеть
  # в момент загрузки игрока.
  join-delay-seconds: 5


# ─────────────────────────────────────────────────────────────────────────────
#  ПРИВЯЗКА
# ─────────────────────────────────────────────────────────────────────────────
link:

  # Сколько минут живёт код привязки из /snsocial link.
  code-ttl-minutes: 10


# ─────────────────────────────────────────────────────────────────────────────
#  ХРАНИЛИЩЕ
#  Драйверы SQLite и MySQL уже встроены в Paper — ничего ставить не нужно.
# ─────────────────────────────────────────────────────────────────────────────
storage:

  # sqlite — файл plugins/SNSocial/data.db, подходит одиночному серверу.
  # mysql  — для сеток и тех, у кого база уже есть.
  type: sqlite

  # Префикс таблиц (snsocial_players, snsocial_claims).
  table-prefix: "snsocial_"

  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    user: "root"
    password: ""


# ─────────────────────────────────────────────────────────────────────────────
#  НАГРАДЫ
#  Каждая награда — секция со своим id. Команды выполняются от консоли,
#  %player% — ник игрока, %uuid% — его UUID.
#
#  requires:       [telegram], [vk] или [telegram, vk] — что нужно для награды
#  type:           subscribe — разово за подписку; periodic — каждые period-hours
#  reclaimable:    можно ли забрать subscribe-награду снова после отката
#                  (по умолчанию false: отписался и вернулся — награды больше нет,
#                  иначе её можно фармить подписками туда-сюда)
#  auto-claim:     выдавать автоматически при входе/перепроверке, без клика в GUI
#  revoke-commands: выполняются при отписке (откат выданного)
#  icon, slot, description: как награда выглядит в GUI (/snsocial)
# ─────────────────────────────────────────────────────────────────────────────
rewards:

  tg_sub:
    requires: [ telegram ]
    type: subscribe
    display-name: "<gradient:#7B2FFF:#00E1FF>Подписка на Telegram</gradient>"
    icon: DIAMOND
    slot: 11
    description:
      - "<gray>Подпишись на наш Telegram-канал"
      - "<gray>и получи <aqua>3 алмаза</aqua>."
    commands:
      - "give %player% diamond 3"
    revoke-commands: []
    reclaimable: false
    auto-claim: false

  vk_sub:
    requires: [ vk ]
    type: subscribe
    display-name: "<gradient:#0077FF:#00E1FF>Подписка на VK</gradient>"
    icon: EMERALD
    slot: 13
    description:
      - "<gray>Вступи в нашу группу ВКонтакте"
      - "<gray>и получи <green>3 изумруда</green>."
    commands:
      - "give %player% emerald 3"
    revoke-commands: []
    reclaimable: false
    auto-claim: false

  daily_bonus:
    requires: [ telegram, vk ]
    type: periodic
    period-hours: 24
    display-name: "<gold>Ежедневный бонус подписчика</gold>"
    icon: SUNFLOWER
    slot: 15
    description:
      - "<gray>Подписан и там, и там?"
      - "<gray>Каждый день — <gold>сюрприз</gold>."
    commands:
      - "give %player% golden_apple 1"
    auto-claim: false
