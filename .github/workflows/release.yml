name: release

# Cut a release by pushing a tag:  git tag v26.8.1 && git push origin v26.8.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Behaviour is proven offline: the full assertion suite over canned API responses.
      - name: Self-test (offline)
        run: bash tools/offline/verify.sh

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # The published jar is built against the REAL paper-api, never against the offline
      # stubs. Unlike in the build workflow, nothing here is allowed to fail: a release
      # that cannot be built against the real API is not a release.
      - name: Build against the real paper-api
        run: gradle build --no-daemon

      - name: Stubs must match the real Paper API
        run: |
          bash tools/offline/api-surface.sh build/offline/classes --all > /tmp/from-stubs.txt
          bash tools/offline/api-surface.sh build/classes/java/main --all > /tmp/from-paper.txt
          if ! diff -u /tmp/from-stubs.txt /tmp/from-paper.txt; then
            echo "::error::tools/offline/bukkit-stubs disagrees with the real paper-api"
            exit 1
          fi
          echo "stubs agree with paper-api"

      # A tag that disagrees with the version compiled into the jar would advertise a release
      # that does not exist inside the file. Cheaper to catch here than in a bug report.
      - name: Tag must match the compiled version
        run: |
          VERSION="$(grep -oP 'VERSION = "\K[^"]+' src/main/java/network/somikyy/snsocial/core/Version.java)"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Version.VERSION=$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release may already exist as a draft prepared by hand; that is fine.
          gh release create "$GITHUB_REF_NAME" \
             --title "SNSocial $VERSION" \
             --notes "Награды за подписку на Telegram-канал и группу ВКонтакте. Установка и описание — в README репозитория." \
             || echo "release already exists, uploading into it"
          gh release upload "$GITHUB_REF_NAME" \
             "build/libs/SNSocial-$VERSION.jar" --clobber
